id = "mpospirit.rsdia"
name = "rsdia"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "A Rust TUI/CLI diagramming tool: draw ASCII diagrams in your terminal and export them as text"
platforms = ["linux", "macos"]

# rsdia is a single static binary; build it once at install time.
[[build]]
command = ["cargo", "build", "--release"]

# The editor itself. `rsdia open-pane` requests a right-hand split against the
# active pane at launch time, overriding this default.
[[panes]]
id = "canvas"
title = "rsdia"
placement = "split"
command = ["target/release/rsdia"]

# Keybindings can only invoke actions, so this opens the pane over the socket API.
[[actions]]
id = "open"
title = "Open rsdia"
contexts = ["workspace"]
command = ["target/release/rsdia", "open-pane"]

# Plugin manifests cannot declare keybindings themselves — herdr owns that
# surface. Add the block below to your own config.toml (see README) and
# `herdr server reload-config`.
#
# [[keys.command]]
# key = "prefix+ctrl+d"
# type = "plugin_action"
# command = "mpospirit.rsdia.open"
# description = "open rsdia"
