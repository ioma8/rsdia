[package]
name = "rsdia"
version = "0.2.0"
edition = "2021"
description = "A Rust TUI/CLI diagramming tool: draw ASCII diagrams in your terminal and export them as text"
license = "MIT"
repository = "https://github.com/mpospirit/rsdia"
homepage = "https://github.com/mpospirit/rsdia"
keywords = ["ascii", "asciiflow", "diagram", "terminal", "tui"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = { version = "0.29.0", features = ["osc52"] }
indexmap = "2"
libc = "0.2.189"
ratatui = "0.30"
serde_json = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"

[lib]
name = "rsdia"
path = "src/lib.rs"

[[bin]]
name = "rsdia"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
