[package]
name = "rsdia"
version = "0.2.0"
edition = "2021"
description = "A terminal editor for ASCII diagrams: draw boxes, arrows, lines and text, and export them as plain text"
license = "MIT"
repository = "https://github.com/ioma8/rsdia"
homepage = "https://ioma8.github.io/rsdia/"
keywords = ["ascii", "asciiflow", "diagram", "terminal", "tui"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = { version = "0.29.0", features = ["osc52"] }
libc = "0.2.189"
ratatui = "0.30"
serde_json = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"

[lib]
name = "rsdia"
path = "src/lib.rs"

[[bin]]
name = "rsdia"
path = "src/main.rs"

[profile.release]
lto = true
strip = true

# Strict clippy: `cargo clippy --all-targets` must stay clean, so these are errors
# rather than suggestions.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
